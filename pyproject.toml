[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "house_pricing_nbdev"
dynamic = ["version"]
description = "House Pricing nbdev Software"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "'Ishmael'", email = "ishmael.asabere@gmail.com"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.urls]
Repository = "https://github.com/IshmaelAsab/house_pricing_nbdev"
Documentation = "https://IshmaelAsab.github.io/house_pricing_nbdev/"

[project.entry-points.nbdev]
house_pricing_nbdev = "house_pricing_nbdev._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "house_pricing_nbdev.__version__"}

[tool.setuptools.packages.find]
include = ["house_pricing_nbdev"]

[tool.nbdev]
